<script>
// State Management
let presetsState = {};
let activePresetName = '';

// Initial load on DOM ready
document.addEventListener('DOMContentLoaded', () => {
  initDefaults();
  loadPresetsFromLocalStorage();
  syncCloudPresetsSilently();
});

// Default Presets initialization if empty
function initDefaults() {
  const localData = localStorage.getItem('WSB_PRESETS');
  if (localData === null) {
    const defaultPresets = {
      "기본 샌드박스 (Default)": {
        presetName: "기본 샌드박스 (Default)",
        presetDescription: "표준 Windows Sandbox 기본 설정",
        vGpu: "Default",
        networking: "Default",
        memoryInMB: "",
        clipboard: "Default",
        audioInput: "Default",
        videoInput: "Default",
        protectedClient: "Default",
        printerRedirection: "Default",
        mappedFolders: [
          { hostFolder: "C:\\Users\\Public\\Downloads", sandboxFolder: "C:\\Users\\WDAGUtilityAccount\\Desktop\\Downloads", readOnly: true }
        ],
        logonCommand: ""
      },
      "개발자용 샌드박스 (VS Code & Winget)": {
        presetName: "개발자용 샌드박스 (VS Code & Winget)",
        presetDescription: "VS Code 및 개발 도구 자동 설치 개발 환경",
        vGpu: "Enable",
        networking: "Default",
        memoryInMB: "8192",
        clipboard: "Default",
        audioInput: "Default",
        videoInput: "Disable",
        protectedClient: "Default",
        printerRedirection: "Disable",
        mappedFolders: [
          { hostFolder: "C:\\Users\\Public\\Downloads", sandboxFolder: "C:\\Users\\WDAGUtilityAccount\\Desktop\\Downloads", readOnly: false }
        ],
        logonCommand: `cmd.exe /c "curl.exe -sSL -o %TEMP%\\vscode.exe https://update.code.visualstudio.com/latest/win32-x64/stable && %TEMP%\\vscode.exe /verysilent /suppressmsgboxes /norestart"`
      }
    };
    presetsState = defaultPresets;
    savePresetsToLocalStorage();
  }
}

// ----------------------------------------------------
// Form Data Collector & Setter
// ----------------------------------------------------
function collectFormData() {
  const mappedFolders = [];
  const folderRows = document.querySelectorAll('.folder-row');
  folderRows.forEach(row => {
    const hostFolder = row.querySelector('.host-folder').value.trim();
    const sandboxFolder = row.querySelector('.sandbox-folder').value.trim();
    const readOnly = row.querySelector('.read-only-toggle').checked;
    if (hostFolder) {
      mappedFolders.push({ hostFolder, sandboxFolder, readOnly });
    }
  });

  return {
    presetName: document.getElementById('presetName').value.trim() || 'Custom Sandbox',
    presetDescription: document.getElementById('presetDescription').value.trim(),
    vGpu: document.getElementById('vGpu').value,
    networking: document.getElementById('networking').value,
    memoryInMB: document.getElementById('memoryInMB').value,
    clipboard: document.getElementById('clipboard').value,
    audioInput: document.getElementById('audioInput').value,
    videoInput: document.getElementById('videoInput').value,
    protectedClient: document.getElementById('protectedClient').value,
    printerRedirection: document.getElementById('printerRedirection').value,
    mappedFolders: mappedFolders,
    logonCommand: document.getElementById('logonCommand').value
  };
}

function fillFormWithData(data) {
  document.getElementById('presetName').value = data.presetName || '';
  document.getElementById('presetDescription').value = data.presetDescription || '';
  document.getElementById('vGpu').value = data.vGpu || 'Default';
  document.getElementById('networking').value = data.networking || 'Default';
  document.getElementById('memoryInMB').value = data.memoryInMB || '';
  document.getElementById('clipboard').value = data.clipboard || 'Default';
  document.getElementById('audioInput').value = data.audioInput || 'Default';
  document.getElementById('videoInput').value = data.videoInput || 'Default';
  document.getElementById('protectedClient').value = data.protectedClient || 'Default';
  document.getElementById('printerRedirection').value = data.printerRedirection || 'Default';
  document.getElementById('logonCommand').value = data.logonCommand || '';

  // Render folder rows
  const container = document.getElementById('folderContainer');
  container.innerHTML = '';
  if (data.mappedFolders && data.mappedFolders.length > 0) {
    data.mappedFolders.forEach(folder => addFolderRow(folder));
  } else {
    addFolderRow(); // Add 1 empty row by default
  }
}

// ----------------------------------------------------
// Folder Mapping Dynamic Rows
// ----------------------------------------------------
function addFolderRow(folderData = {}) {
  const container = document.getElementById('folderContainer');
  const rowId = 'folder_row_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);

  const rowHtml = `
    <div id="${rowId}" class="folder-row bg-slate-900/80 p-3 rounded-xl border border-slate-800 space-y-2 relative group">
      <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center">
        <div class="sm:col-span-6">
          <label class="block text-[10px] text-slate-400 mb-0.5">호스트 폴더 경로 (Host Folder)</label>
          <input type="text" value="${escapeHtml(folderData.hostFolder || '')}" placeholder="예: C:\\Users\\Public\\Downloads" class="host-folder w-full bg-slate-950 border border-slate-700/70 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:border-sky-500 focus:outline-none font-code">
        </div>
        <div class="sm:col-span-4">
          <label class="block text-[10px] text-slate-400 mb-0.5">샌드박스 내부 경로 (Sandbox Folder)</label>
          <input type="text" value="${escapeHtml(folderData.sandboxFolder || '')}" placeholder="선택사항 (기본: Desktop)" class="sandbox-folder w-full bg-slate-950 border border-slate-700/70 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:border-sky-500 focus:outline-none font-code">
        </div>
        <div class="sm:col-span-2 flex items-center justify-between sm:justify-end gap-3 pt-3 sm:pt-4">
          <label class="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer selection:none">
            <input type="checkbox" ${folderData.readOnly ? 'checked' : ''} class="read-only-toggle rounded border-slate-700 text-sky-500 focus:ring-sky-500 bg-slate-950">
            <span class="text-[11px]">읽기 전용</span>
          </label>
          <button type="button" onclick="removeFolderRow('${rowId}')" class="text-slate-500 hover:text-rose-400 p-1 transition" title="행 삭제">
            <i class="fa-solid fa-trash-can text-xs"></i>
          </button>
        </div>
      </div>
    </div>
  `;
  container.insertAdjacentHTML('beforeend', rowHtml);
}

function removeFolderRow(rowId) {
  const row = document.getElementById(rowId);
  if (row) {
    row.remove();
  }
}

function addDefaultDownloadsFolder() {
  addFolderRow({
    hostFolder: "C:\\Users\\Public\\Downloads",
    sandboxFolder: "C:\\Users\\WDAGUtilityAccount\\Desktop\\Downloads",
    readOnly: true
  });
  showToast('Public Downloads 매핑 폴더가 추가되었습니다.', 'info');
}

function setQuickMemory(mb) {
  document.getElementById('memoryInMB').value = mb;
}

// ----------------------------------------------------
// Snippet Templates
// ----------------------------------------------------
function applySnippetTemplate() {
  const select = document.getElementById('snippetSelect');
  const val = select.value;
  if (!val) return;

  const logonCmd = document.getElementById('logonCommand');
  let snippet = '';

  switch (val) {
    case 'direct-chrome':
      snippet = `cmd.exe /c "curl.exe -sSL -o %TEMP%\\chrome.msi https://dl.google.com/chrome/install/googlechromestandaloneenterprise64.msi && msiexec.exe /i %TEMP%\\chrome.msi /qn"`;
      break;
    case 'direct-vscode':
      snippet = `cmd.exe /c "curl.exe -sSL -o %TEMP%\\vscode.exe https://update.code.visualstudio.com/latest/win32-x64/stable && %TEMP%\\vscode.exe /verysilent /suppressmsgboxes /norestart"`;
      break;
    case 'direct-7zip':
      snippet = `cmd.exe /c "curl.exe -sSL -o %TEMP%\\7z.exe https://www.7-zip.org/a/7z2408-x64.exe && %TEMP%\\7z.exe /S"`;
      break;
    case 'direct-git':
      snippet = `cmd.exe /c "curl.exe -sSL -o %TEMP%\\git.exe https://github.com/git-for-windows/git/releases/download/v2.44.0.windows.1/Git-2.44.0-64-bit.exe && %TEMP%\\git.exe /VERYSILENT /NORESTART"`;
      break;
    case 'direct-dev-pack':
      snippet = `cmd.exe /c "curl.exe -sSL -o %TEMP%\\chrome.msi https://dl.google.com/chrome/install/googlechromestandaloneenterprise64.msi && msiexec.exe /i %TEMP%\\chrome.msi /qn && curl.exe -sSL -o %TEMP%\\vscode.exe https://update.code.visualstudio.com/latest/win32-x64/stable && %TEMP%\\vscode.exe /verysilent /suppressmsgboxes /norestart && curl.exe -sSL -o %TEMP%\\7z.exe https://www.7-zip.org/a/7z2408-x64.exe && %TEMP%\\7z.exe /S"`;
      break;
    case 'winget-bootstrap':
      snippet = `powershell.exe -ExecutionPolicy Bypass -Command "iwr -useb https://raw.githubusercontent.com/microsoft/winget-cli/master/build/assets/bootstrap.ps1 | iex; winget install -e --id Google.Chrome --accept-package-agreements --accept-source-agreements"`;
      break;
    case 'open-browser':
      snippet = `cmd.exe /c start https://google.com`;
      break;
    case 'ps1-desktop':
      snippet = `powershell.exe -ExecutionPolicy Bypass -File C:\\Users\\WDAGUtilityAccount\\Desktop\\init.ps1`;
      break;
  }

  if (snippet) {
    logonCmd.value = snippet;
    showToast('시작 스크립트 템플릿이 적용되었습니다.', 'success');
  }
  select.value = '';
}

// ----------------------------------------------------
// XML Generation & Export
// ----------------------------------------------------
function generateWsbXml(formData) {
  let xml = `<!--\n`;
  xml += `  WSB Manager Web Generated Configuration\n`;
  xml += `  Preset Name : ${escapeXml(formData.presetName || 'Custom Sandbox')}\n`;
  if (formData.presetDescription && formData.presetDescription.trim() !== '') {
    xml += `  Description : ${escapeXml(formData.presetDescription.trim())}\n`;
  }
  xml += `  Generated At: ${new Date().toLocaleString('ko-KR')}\n`;
  xml += `-->\n<Configuration>\n`;

  if (formData.vGpu) xml += `  <VGpu>${formData.vGpu}</VGpu>\n`;
  if (formData.networking) xml += `  <Networking>${formData.networking}</Networking>\n`;

  // Mapped Folders
  if (formData.mappedFolders && formData.mappedFolders.length > 0) {
    xml += `  <MappedFolders>\n`;
    formData.mappedFolders.forEach(folder => {
      if (folder.hostFolder) {
        xml += `    <MappedFolder>\n`;
        xml += `      <HostFolder>${escapeXml(folder.hostFolder)}</HostFolder>\n`;
        if (folder.sandboxFolder) {
          xml += `      <SandboxFolder>${escapeXml(folder.sandboxFolder)}</SandboxFolder>\n`;
        }
        xml += `      <ReadOnly>${folder.readOnly ? 'true' : 'false'}</ReadOnly>\n`;
        xml += `    </MappedFolder>\n`;
      }
    });
    xml += `  </MappedFolders>\n`;
  }

  // Logon Command
  if (formData.logonCommand && formData.logonCommand.trim() !== '') {
    xml += `  <LogonCommand>\n`;
    xml += `    <Command>${escapeXml(formData.logonCommand.trim())}</Command>\n`;
    xml += `  </LogonCommand>\n`;
  }

  // Memory
  if (formData.memoryInMB && parseInt(formData.memoryInMB) > 0) {
    xml += `  <MemoryInMB>${parseInt(formData.memoryInMB)}</MemoryInMB>\n`;
  }

  // Device Redirections
  if (formData.audioInput) xml += `  <AudioInput>${formData.audioInput}</AudioInput>\n`;
  if (formData.videoInput) xml += `  <VideoInput>${formData.videoInput}</VideoInput>\n`;
  if (formData.protectedClient) xml += `  <ProtectedClient>${formData.protectedClient}</ProtectedClient>\n`;
  if (formData.printerRedirection) xml += `  <PrinterRedirection>${formData.printerRedirection}</PrinterRedirection>\n`;
  if (formData.clipboard) xml += `  <ClipboardRedirection>${formData.clipboard}</ClipboardRedirection>\n`;

  xml += `</Configuration>`;
  return xml;
}

function exportWsbFile() {
  const formData = collectFormData();
  const xmlContent = generateWsbXml(formData);
  const blob = new Blob([xmlContent], { type: 'text/xml;charset=utf-8;' });
  
  const sanitizedFilename = (formData.presetName || 'sandbox_config').replace(/[/\\?%*:|"<>]/g, '_');
  const filename = `${sanitizedFilename}.wsb`;

  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  showToast(`'${filename}' 파일 다운로드가 시작되었습니다.`, 'success');
}

function previewWsbXml() {
  const formData = collectFormData();
  const xmlContent = generateWsbXml(formData);
  document.getElementById('xmlModalContent').textContent = xmlContent;
  document.getElementById('xmlModal').classList.remove('hidden');
}

function closeXmlModal() {
  document.getElementById('xmlModal').classList.add('hidden');
}

function copyXmlToClipboard() {
  const xmlText = document.getElementById('xmlModalContent').textContent;
  navigator.clipboard.writeText(xmlText).then(() => {
    showToast('XML 코드가 클립보드에 복사되었습니다.', 'success');
  }).catch(err => {
    showToast('클립보드 복사 실패: ' + err, 'error');
  });
}

// ----------------------------------------------------
// Preset Management (Local & Cloud Sync)
// ----------------------------------------------------
function loadPresetsFromLocalStorage() {
  try {
    const raw = localStorage.getItem('WSB_PRESETS');
    if (raw !== null) {
      presetsState = JSON.parse(raw);
    }
  } catch (e) {
    console.error(e);
  }
  
  const keys = Object.keys(presetsState);
  if (keys.length > 0 && !activePresetName) {
    loadPreset(keys[0]);
  } else if (keys.length === 0) {
    createNewPreset();
  } else {
    renderPresetList();
  }
}

function savePresetsToLocalStorage() {
  localStorage.setItem('WSB_PRESETS', JSON.stringify(presetsState));
}

function renderPresetList(filter = '') {
  const listEl = document.getElementById('presetList');
  if (!listEl) return;
  listEl.innerHTML = '';

  const keys = Object.keys(presetsState).filter(k => {
    const p = presetsState[k];
    const matchName = k.toLowerCase().includes(filter.toLowerCase());
    const matchDesc = p.presetDescription && p.presetDescription.toLowerCase().includes(filter.toLowerCase());
    return matchName || matchDesc;
  });

  if (keys.length === 0) {
    listEl.innerHTML = `<li class="text-xs text-slate-500 text-center py-6"><i class="fa-solid fa-folder-open block text-xl mb-1 text-slate-600"></i>저장된 프리셋이 없습니다.</li>`;
    return;
  }

  keys.forEach(name => {
    const isActive = name === activePresetName;
    const item = document.createElement('li');
    item.className = `preset-item glass-card-hover p-3 rounded-xl border border-slate-800 cursor-pointer flex items-center justify-between group ${isActive ? 'active' : ''}`;
    
    const descText = presetsState[name].presetDescription ? escapeHtml(presetsState[name].presetDescription) : '';

    item.innerHTML = `
      <div class="flex-1 pr-2 truncate" onclick="loadPreset('${escapeJsString(name)}')">
        <div class="font-medium text-xs text-slate-200 group-hover:text-sky-300 truncate flex items-center gap-1.5">
          ${escapeHtml(name)}
        </div>
        ${descText ? `<div class="text-[11px] text-sky-400/80 truncate mt-0.5 font-normal"><i class="fa-regular fa-comment-dots mr-1 text-[10px]"></i>${descText}</div>` : ''}
        <div class="text-[10px] text-slate-500 truncate mt-0.5">
          vGPU: ${presetsState[name].vGpu || 'Default'} | Net: ${presetsState[name].networking || 'Default'}
        </div>
      </div>
      <button onclick="event.stopPropagation(); deletePresetByName('${escapeJsString(name)}')" class="text-slate-600 hover:text-rose-400 p-1 opacity-0 group-hover:opacity-100 transition" title="삭제">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
    `;
    listEl.appendChild(item);
  });
}

function loadPreset(name) {
  if (presetsState[name]) {
    activePresetName = name;
    fillFormWithData(presetsState[name]);
    renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');
    showToast(`'${name}' 프리셋을 불러왔습니다.`, 'info');
  }
}

function createNewPreset() {
  activePresetName = '';
  fillFormWithData({
    presetName: "새 프리셋 " + (Object.keys(presetsState).length + 1),
    presetDescription: "",
    vGpu: "Default",
    networking: "Default",
    memoryInMB: "",
    clipboard: "Default",
    audioInput: "Default",
    videoInput: "Default",
    protectedClient: "Default",
    printerRedirection: "Default",
    mappedFolders: [],
    logonCommand: ""
  });
  renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');
}

function saveCurrentPreset() {
  const data = collectFormData();
  if (!data.presetName) {
    showToast('프리셋 이름을 입력해주세요.', 'error');
    return;
  }

  // If activePresetName changed (renamed), delete old key
  if (activePresetName && activePresetName !== data.presetName && presetsState[activePresetName]) {
    delete presetsState[activePresetName];
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.deletePresetFromCloud(activePresetName);
    }
  }

  presetsState[data.presetName] = data;
  activePresetName = data.presetName;
  savePresetsToLocalStorage();
  renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');

  // Cloud sync if available
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success) {
          showToast(`'${data.presetName}' 클라우드 및 로컬 저장 완료!`, 'success');
        } else {
          showToast(`로컬 저장 완료 (클라우드: ${res ? res.error : ''})`, 'info');
        }
      })
      .savePresetToCloud(data.presetName, data);
  } else {
    showToast(`'${data.presetName}' 프리셋이 로컬에 저장되었습니다.`, 'success');
  }
}

function deleteCurrentPreset() {
  const inputName = document.getElementById('presetName').value.trim();
  const targetName = (activePresetName && presetsState[activePresetName]) ? activePresetName : (presetsState[inputName] ? inputName : null);

  if (targetName) {
    deletePresetByName(targetName);
  } else {
    activePresetName = '';
    createNewPreset();
    showToast('작성 중인 폼 내용이 초기화되었습니다.', 'info');
  }
}

function deletePresetByName(name) {
  if (!name) return;
  if (confirm(`'${name}' 프리셋을 삭제하시겠습니까?`)) {
    if (presetsState[name]) {
      delete presetsState[name];
      savePresetsToLocalStorage();

      // Cloud Deletion Trigger (both method names supported)
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        if (Object.keys(presetsState).length === 0) {
          google.script.run.clearAllPresetsFromCloud();
        } else {
          google.script.run.deletePresetFromCloud(name);
        }
      }

      const remainingKeys = Object.keys(presetsState);
      if (remainingKeys.length > 0) {
        if (activePresetName === name) {
          loadPreset(remainingKeys[0]);
        } else {
          renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');
        }
      } else {
        activePresetName = '';
        createNewPreset();
      }
      showToast(`'${name}' 프리셋이 삭제되었습니다.`, 'info');
    } else {
      activePresetName = '';
      createNewPreset();
    }
  }
}

function filterPresets() {
  const filter = document.getElementById('presetSearch').value;
  renderPresetList(filter);
}

// ----------------------------------------------------
// GAS Cloud Sync & Drive Backup Functions
// ----------------------------------------------------
function syncCloudPresets() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    showToast('구글 클라우드에서 프리셋을 동기화하는 중...', 'info');
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success && res.data) {
          presetsState = res.data;
          savePresetsToLocalStorage();
          
          const keys = Object.keys(presetsState);
          if (keys.length > 0) {
            if (!activePresetName || !presetsState[activePresetName]) {
              loadPreset(keys[0]);
            } else {
              renderPresetList();
            }
          } else {
            createNewPreset();
          }
          showToast('구글 클라우드 프리셋 동기화가 완료되었습니다.', 'success');
        } else {
          showToast('클라우드 동기화 실패: ' + (res ? res.error : '알 수 없는 오류'), 'error');
        }
      })
      .getPresetsFromCloud();
  } else {
    showToast('GAS 환경에서만 클라우드 동기화가 지원됩니다. (로컬 모드 실행 중)', 'info');
  }
}

function syncCloudPresetsSilently() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success && res.data) {
          presetsState = res.data;
          savePresetsToLocalStorage();
          
          const keys = Object.keys(presetsState);
          if (keys.length > 0) {
            if (!activePresetName || !presetsState[activePresetName]) {
              loadPreset(keys[0]);
            } else {
              renderPresetList();
            }
          } else {
            createNewPreset();
          }
        }
      })
      .getPresetsFromCloud();
  }
}

function backupDrive() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    showToast('Google Drive에 백업 생성 중...', 'info');
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success) {
          showToast(res.message, 'success');
        } else {
          showToast(res ? res.error : 'Drive 백업 실패', 'error');
        }
      })
      .exportPresetsToDrive();
  } else {
    showToast('GAS 백엔드가 연결된 환경에서만 Google Drive 백업이 가능합니다.', 'info');
  }
}

function openDriveBackupModal() {
  const modal = document.getElementById('driveBackupModal');
  const fileList = document.getElementById('driveBackupFileList');
  const infoText = document.getElementById('driveFolderNameInfo');
  modal.classList.remove('hidden');

  fileList.innerHTML = `<li class="text-xs text-slate-500 text-center py-6"><i class="fa-solid fa-spinner fa-spin mr-1"></i>Google Drive 백업 목록을 불러오는 중...</li>`;

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success && res.files) {
          infoText.textContent = res.folderName ? `백업 위치: Google Drive [${res.folderName}]` : '';
          if (res.files.length === 0) {
            fileList.innerHTML = `<li class="text-xs text-slate-500 text-center py-6">저장된 Drive 백업 파일이 없습니다.</li>`;
            return;
          }

          fileList.innerHTML = '';
          res.files.forEach(file => {
            const sizeKb = (file.size / 1024).toFixed(1);
            const li = document.createElement('li');
            li.className = 'glass-card-hover p-3 rounded-xl border border-slate-800 flex items-center justify-between group';
            li.innerHTML = `
              <div class="flex-1 pr-2 truncate">
                <div class="font-medium text-xs text-slate-200 group-hover:text-sky-300 truncate flex items-center gap-1.5">
                  <i class="fa-solid fa-file-code text-emerald-400 text-xs"></i>
                  ${escapeHtml(file.name)}
                </div>
                <div class="text-[10px] text-slate-500 truncate mt-0.5">
                  생성일시: ${escapeHtml(file.updatedAt)} | 크기: ${sizeKb} KB
                </div>
              </div>
              <button onclick="restoreFromDriveFile('${escapeJsString(file.id)}')" type="button" class="bg-sky-600/20 hover:bg-sky-600/40 text-sky-300 border border-sky-500/30 px-3 py-1 rounded-lg text-xs font-medium transition flex items-center gap-1">
                <i class="fa-solid fa-cloud-arrow-down"></i> 복원
              </button>
            `;
            fileList.appendChild(li);
          });
        } else {
          fileList.innerHTML = `<li class="text-xs text-rose-400 text-center py-6">백업 목록 로드 실패: ${escapeHtml(res ? res.error : '')}</li>`;
        }
      })
      .listDriveBackups();
  } else {
    fileList.innerHTML = `<li class="text-xs text-slate-500 text-center py-6">GAS 연결 환경에서만 Google Drive 백업 목록 조회가 가능합니다.</li>`;
  }
}

function closeDriveBackupModal() {
  document.getElementById('driveBackupModal').classList.add('hidden');
}

function restoreFromDriveFile(fileId) {
  if (confirm('선택한 Drive 백업 파일에서 프리셋을 복원하시겠습니까? (기존 프리셋 병합)')) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      showToast('Drive 백업 파일에서 복원 중...', 'info');
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.success && res.data) {
            presetsState = Object.assign({}, presetsState, res.data);
            savePresetsToLocalStorage();
            
            const keys = Object.keys(res.data);
            if (keys.length > 0) {
              loadPreset(keys[0]);
            } else {
              renderPresetList();
            }
            closeDriveBackupModal();
            showToast(res.message, 'success');
          } else {
            showToast(res ? res.error : '복원 실패', 'error');
          }
        })
        .importFromDriveFile(fileId);
    }
  }
}

// ----------------------------------------------------
// Import / Export JSON Local Files
// ----------------------------------------------------
function exportPresetsJson() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(presetsState, null, 2));
  const link = document.createElement('a');
  link.setAttribute("href", dataStr);
  link.setAttribute("download", `wsb_presets_export_${new Date().toISOString().slice(0,10)}.json`);
  document.body.appendChild(link);
  link.click();
  link.remove();
  showToast('프리셋 JSON 파일 내보내기가 완료되었습니다.', 'success');
}

function openImportJsonModal() {
  const modal = document.getElementById('importJsonModal');
  const fileNameEl = document.getElementById('importFileName');
  const textAreaEl = document.getElementById('importJsonText');
  if (modal) modal.classList.remove('hidden');
  if (fileNameEl) fileNameEl.textContent = '선택된 파일 없음';
  if (textAreaEl) textAreaEl.value = '';
}

function closeImportJsonModal() {
  const modal = document.getElementById('importJsonModal');
  if (modal) modal.classList.add('hidden');
}

function processImportedObject(imported, sourceName = 'JSON') {
  if (typeof imported === 'object' && imported !== null && !Array.isArray(imported)) {
    // Merge imported presets with presetsState
    presetsState = Object.assign({}, presetsState, imported);
    savePresetsToLocalStorage();

    // Sync imported presets to Cloud (Chunking enabled)
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((res) => {
          showToast(`'${sourceName}' 프리셋 복원 및 클라우드 연동 완료!`, 'success');
        })
        .withFailureHandler((err) => {
          showToast(`로컬 복원 완료 (클라우드: ${err ? err.message : ''})`, 'info');
        })
        .saveAllPresetsToCloud(presetsState);
    } else {
      showToast(`'${sourceName}' 프리셋이 성공적으로 복원되었습니다.`, 'success');
    }

    const keys = Object.keys(imported);
    if (keys.length > 0) {
      loadPreset(keys[0]);
    } else {
      renderPresetList();
    }
    closeImportJsonModal();
    return true;
  } else {
    showToast('유효하지 않은 프리셋 JSON 포맷입니다.', 'error');
    return false;
  }
}

function importPresetsJson(event) {
  const files = event.target ? event.target.files : null;
  if (!files || files.length === 0) return;

  const file = files[0];
  const fileNameEl = document.getElementById('importFileName');
  if (fileNameEl) fileNameEl.textContent = file.name;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const content = e.target.result;
      const imported = JSON.parse(content);
      processImportedObject(imported, file.name);
    } catch (err) {
      showToast('JSON 파일 파싱 실패: ' + err.message, 'error');
    }
    if (event.target) event.target.value = '';
  };
  reader.readAsText(file);
}

function importPresetsFromText() {
  const textEl = document.getElementById('importJsonText');
  const text = textEl ? textEl.value.trim() : '';
  if (!text) {
    showToast('복원할 JSON 텍스트를 입력해주세요.', 'error');
    return;
  }

  try {
    const imported = JSON.parse(text);
    processImportedObject(imported, '직접 입력한 텍스트');
  } catch (err) {
    showToast('JSON 텍스트 파싱 오류: ' + err.message, 'error');
  }
}

// ----------------------------------------------------
// Utilities & Helpers
// ----------------------------------------------------
function escapeXml(unsafe) {
  if (!unsafe) return '';
  return String(unsafe).replace(/[<>&'"]/g, function (c) {
    switch (c) {
      case '<': return '&lt;';
      case '>': return '&gt;';
      case '&': return '&amp;';
      case '\'': return '&apos;';
      case '"': return '&quot;';
      default: return c;
    }
  });
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeJsString(str) {
  if (!str) return '';
  return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  
  let bgColor = 'bg-slate-900 border-slate-700 text-slate-200';
  let icon = '<i class="fa-solid fa-circle-info text-sky-400"></i>';

  if (type === 'success') {
    bgColor = 'bg-slate-900 border-emerald-500/50 text-emerald-300';
    icon = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
  } else if (type === 'error') {
    bgColor = 'bg-slate-900 border-rose-500/50 text-rose-300';
    icon = '<i class="fa-solid fa-circle-exclamation text-rose-400"></i>';
  }

  toast.className = `animate-fade-in-down ${bgColor} border px-4 py-3 rounded-xl shadow-2xl text-xs font-medium flex items-center gap-2.5 pointer-events-auto min-w-[240px]`;
  toast.innerHTML = `${icon} <span>${escapeHtml(message)}</span>`;

  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'all 0.3s ease-out';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}
</script>
