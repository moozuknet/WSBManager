<script>
// State Management (GAS Cloud Storage as Single Source of Truth)
let presetsState = {};
let activePresetName = '';
let presetCustomOrder = [];
let draggedItemName = null;

// Initial load on DOM ready
document.addEventListener('DOMContentLoaded', () => {
  loadCloudPresets();
  initWsbDropZone();
  initModalCloseEvents();
});

function initModalCloseEvents() {
  // ESC key shortcut listener to close active modals
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' || e.key === 'Esc') {
      closeXmlModal();
      closeXmlImportModal();
    }
  });

  // Backdrop click to close modals
  const xmlModal = document.getElementById('xmlModal');
  if (xmlModal) {
    xmlModal.addEventListener('click', (e) => {
      if (e.target === xmlModal) closeXmlModal();
    });
  }

  const xmlImportModal = document.getElementById('xmlImportModal');
  if (xmlImportModal) {
    xmlImportModal.addEventListener('click', (e) => {
      if (e.target === xmlImportModal) closeXmlImportModal();
    });
  }
}

// ----------------------------------------------------
// Cloud Presets Loader (Primary Entry Point)
// ----------------------------------------------------
function loadCloudPresets(isManual = false) {
  const listEl = document.getElementById('presetList');
  if (listEl && Object.keys(presetsState).length === 0) {
    listEl.innerHTML = `<li class="text-xs text-sky-400 text-center py-6 animate-pulse"><i class="fa-solid fa-cloud-arrow-down block text-2xl mb-2 text-sky-500"></i>클라우드 프리셋 불러오는 중...</li>`;
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    if (isManual) {
      showToast('구글 클라우드에서 최신 프리셋을 동기화하는 중...', 'info');
    }
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success && res.data) {
          presetsState = res.data;
          presetCustomOrder = Array.isArray(res.order) ? res.order : [];

          // Auto-clean & migrate legacy URLs/encodings in presets
          Object.keys(presetsState).forEach(k => {
            if (presetsState[k] && presetsState[k].logonCommand) {
              presetsState[k].logonCommand = presetsState[k].logonCommand
                .replace(/&amp;/g, '&')
                .replace(/https:\/\/code\.visualstudio\.com\/sha\/download\?build=stable&os=win32-x64-user/g, 'https://update.code.visualstudio.com/latest/win32-x64-user/stable')
                .replace(/https:\/\/code\.visualstudio\.com\/sha\/download\?build=stable&amp;os=win32-x64-user/g, 'https://update.code.visualstudio.com/latest/win32-x64-user/stable')
                .replace(/Chrome &amp; VS Code/g, 'Chrome 및 VS Code')
                .replace(/Chrome & VS Code/g, 'Chrome 및 VS Code');
            }
          });

          const keys = getOrderedPresetKeys();
          if (keys.length > 0) {
            if (!activePresetName || !presetsState[activePresetName]) {
              loadPreset(keys[0]);
            } else {
              fillFormWithData(presetsState[activePresetName]);
              renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');
            }
          } else {
            createNewPreset();
          }

          if (isManual) {
            showToast('클라우드 프리셋 동기화가 완료되었습니다.', 'success');
          }
        } else {
          showToast('클라우드 프리셋 로드 실패: ' + (res ? res.error : '알 수 없는 오류'), 'error');
          if (Object.keys(presetsState).length === 0) createNewPreset();
        }
      })
      .withFailureHandler((err) => {
        showToast('클라우드 서버 통신 오류: ' + err.message, 'error');
        if (Object.keys(presetsState).length === 0) createNewPreset();
      })
      .getPresetsFromCloud();
  } else {
    // Non-GAS local mockup fallback (in-memory only)
    initLocalFallbackDefaults();
  }
}

// ----------------------------------------------------
// Form Data Collector & Setter
// ----------------------------------------------------
function collectFormData() {
  const mappedFolders = [];
  const folderRows = document.querySelectorAll('.folder-row');
  folderRows.forEach(row => {
    const hostFolder = row.querySelector('.host-folder').value.trim();
    const sandboxFolder = row.querySelector('.sandbox-folder').value.trim();
    const readOnly = row.querySelector('.read-only-toggle').checked;
    if (hostFolder) {
      mappedFolders.push({ hostFolder, sandboxFolder, readOnly });
    }
  });

  return {
    presetName: document.getElementById('presetName').value.trim() || 'Custom Sandbox',
    presetDescription: document.getElementById('presetDescription').value.trim(),
    vGpu: document.getElementById('vGpu').value,
    networking: document.getElementById('networking').value,
    memoryInMB: document.getElementById('memoryInMB').value,
    clipboard: document.getElementById('clipboard').value,
    audioInput: document.getElementById('audioInput').value,
    videoInput: document.getElementById('videoInput').value,
    protectedClient: document.getElementById('protectedClient').value,
    printerRedirection: document.getElementById('printerRedirection').value,
    mappedFolders: mappedFolders,
    logonCommand: document.getElementById('logonCommand').value,
    updatedAt: new Date().toISOString()
  };
}

function getFolderContainer() {
  return document.getElementById('folderMappingContainer') || document.getElementById('folderContainer');
}

function fillFormWithData(data) {
  if (!data) return;
  document.getElementById('presetName').value = data.presetName || '';
  document.getElementById('presetDescription').value = data.presetDescription || '';
  document.getElementById('vGpu').value = data.vGpu || 'Default';
  document.getElementById('networking').value = data.networking || 'Default';
  document.getElementById('memoryInMB').value = data.memoryInMB || '';
  document.getElementById('clipboard').value = data.clipboard || 'Default';
  document.getElementById('audioInput').value = data.audioInput || 'Default';
  document.getElementById('videoInput').value = data.videoInput || 'Default';
  document.getElementById('protectedClient').value = data.protectedClient || 'Default';
  document.getElementById('printerRedirection').value = data.printerRedirection || 'Default';
  document.getElementById('logonCommand').value = data.logonCommand || '';

  // Render folder rows safely
  const container = getFolderContainer();
  if (container) {
    container.innerHTML = '';
    if (data.mappedFolders && data.mappedFolders.length > 0) {
      data.mappedFolders.forEach(folder => addFolderRow(folder));
    } else {
      addFolderRow(); // Add 1 empty row by default
    }
  }
}

// ----------------------------------------------------
// Folder Mapping Dynamic Rows
// ----------------------------------------------------
function addFolderRow(folderData = {}) {
  const container = getFolderContainer();
  if (!container) return;

  const rowId = 'folder_row_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);

  const rowHtml = `
    <div id="${rowId}" class="folder-row bg-slate-900/80 p-3 rounded-xl border border-slate-800 space-y-2 relative group">
      <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center">
        <div class="sm:col-span-6">
          <label class="block text-[10px] text-slate-400 mb-0.5">호스트 폴더 경로 (Host Folder)</label>
          <input type="text" value="${escapeHtml(folderData.hostFolder || '')}" placeholder="예: C:\\Users\\Public\\Downloads" class="host-folder w-full bg-slate-950 border border-slate-700/70 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:border-sky-500 focus:outline-none font-code">
        </div>
        <div class="sm:col-span-4">
          <label class="block text-[10px] text-slate-400 mb-0.5">샌드박스 내부 경로 (Sandbox Folder)</label>
          <input type="text" value="${escapeHtml(folderData.sandboxFolder || '')}" placeholder="선택사항 (기본: Desktop)" class="sandbox-folder w-full bg-slate-950 border border-slate-700/70 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:border-sky-500 focus:outline-none font-code">
        </div>
        <div class="sm:col-span-2 flex items-center justify-between sm:justify-end gap-3 pt-3 sm:pt-4">
          <label class="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer selection:none">
            <input type="checkbox" ${folderData.readOnly ? 'checked' : ''} class="read-only-toggle rounded border-slate-700 text-sky-500 focus:ring-sky-500 bg-slate-950">
            <span class="text-[11px]">읽기 전용</span>
          </label>
          <button type="button" onclick="removeFolderRow('${rowId}')" class="text-slate-500 hover:text-rose-400 p-1 transition" title="행 삭제">
            <i class="fa-solid fa-trash-can text-xs"></i>
          </button>
        </div>
      </div>
    </div>
  `;
  container.insertAdjacentHTML('beforeend', rowHtml);
}

function removeFolderRow(rowId) {
  const row = document.getElementById(rowId);
  if (row) {
    row.remove();
  }
}

function addFolderMappingRow(folderData = {}) {
  addFolderRow(folderData);
}

function addDefaultDownloadsFolder() {

  switch (val) {

      snippet = `cmd.exe /c start "Dev Auto Setup" powershell.exe -NoExit -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol = 3072; iex ((New-Object Net.WebClient).DownloadString('https://raw.githubusercontent.com/moozuknet/WSBManager/main/scripts/install-dev-tools.ps1'))"`;
      break;
    case 'github-tablecloth':
      snippet = `cmd.exe /c start "TableCloth Auto Setup" powershell.exe -NoExit -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol = 3072; iex ((New-Object Net.WebClient).DownloadString('https://raw.githubusercontent.com/moozuknet/WSBManager/main/scripts/init-tablecloth.ps1'))"`;
      break;
    case 'open-browser':
      snippet = `cmd.exe /c start https://google.com`;
      break;
    case 'ps1-desktop':
      snippet = `powershell.exe -ExecutionPolicy Bypass -File C:\\Users\\WDAGUtilityAccount\\Desktop\\Downloads\\init.ps1`;
      break;
  }

  if (snippet) {
    logonCmd.value = snippet;
    showToast('시작 스크립트 템플릿이 적용되었습니다.', 'success');
  }
  select.value = '';
}

// ----------------------------------------------------
// XML Generation & Export
// ----------------------------------------------------
function generateWsbXml(formData) {
  let xml = `<!--\n`;
  xml += `  WSB Manager Web Generated Configuration\n`;
  xml += `  Preset Name : ${escapeXml(formData.presetName || 'Custom Sandbox')}\n`;
  if (formData.presetDescription && formData.presetDescription.trim() !== '') {
    xml += `  Description : ${escapeXml(formData.presetDescription.trim())}\n`;
  }
  xml += `  Generated At: ${new Date().toLocaleString('ko-KR')}\n`;
  xml += `-->\n<Configuration>\n`;

  if (formData.vGpu) xml += `  <VGpu>${formData.vGpu}</VGpu>\n`;
  if (formData.networking) xml += `  <Networking>${formData.networking}</Networking>\n`;

  // Mapped Folders
  if (formData.mappedFolders && formData.mappedFolders.length > 0) {
    xml += `  <MappedFolders>\n`;
    formData.mappedFolders.forEach(folder => {
      if (folder.hostFolder) {
        xml += `    <MappedFolder>\n`;
        xml += `      <HostFolder>${escapeXml(folder.hostFolder)}</HostFolder>\n`;
        if (folder.sandboxFolder) {
          xml += `      <SandboxFolder>${escapeXml(folder.sandboxFolder)}</SandboxFolder>\n`;
        }
        xml += `      <ReadOnly>${folder.readOnly ? 'true' : 'false'}</ReadOnly>\n`;
        xml += `    </MappedFolder>\n`;
      }
    });
    xml += `  </MappedFolders>\n`;
  }

  // Logon Command (Auto-convert PowerShell commands to UTF-16LE Base64 EncodedCommand for 100% Sandbox compatibility)
  if (formData.logonCommand && formData.logonCommand.trim() !== '') {
    const finalCmd = toPowerShellEncodedCommand(formData.logonCommand.trim());
    xml += `  <LogonCommand>\n`;
    xml += `    <Command>${escapeXml(finalCmd)}</Command>\n`;
    xml += `  </LogonCommand>\n`;
  }

  // Memory
  if (formData.memoryInMB && parseInt(formData.memoryInMB) > 0) {
    xml += `  <MemoryInMB>${parseInt(formData.memoryInMB)}</MemoryInMB>\n`;
  }

  // Device Redirections
  if (formData.audioInput) xml += `  <AudioInput>${formData.audioInput}</AudioInput>\n`;
  if (formData.videoInput) xml += `  <VideoInput>${formData.videoInput}</VideoInput>\n`;
  if (formData.protectedClient) xml += `  <ProtectedClient>${formData.protectedClient}</ProtectedClient>\n`;
  if (formData.printerRedirection) xml += `  <PrinterRedirection>${formData.printerRedirection}</PrinterRedirection>\n`;
  if (formData.clipboard) xml += `  <ClipboardRedirection>${formData.clipboard}</ClipboardRedirection>\n`;

  xml += `</Configuration>`;
  return xml;
}

function exportWsbFile() {
  const formData = collectFormData();
  const xmlContent = generateWsbXml(formData);
  const blob = new Blob([xmlContent], { type: 'text/xml;charset=utf-8;' });
  
  const sanitizedFilename = (formData.presetName || 'sandbox_config').replace(/[/\\?%*:|"<>]/g, '_');
  const filename = `${sanitizedFilename}.wsb`;

  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  showToast(`'${filename}' 파일 다운로드가 시작되었습니다.`, 'success');
}

function previewWsbXml() {
  const formData = collectFormData();
  const xmlContent = generateWsbXml(formData);
  document.getElementById('xmlModalContent').textContent = xmlContent;
  const modal = document.getElementById('xmlModal');
  if (modal) {
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    modal.style.display = 'flex';
  }
}

function closeXmlModal() {
  const modal = document.getElementById('xmlModal');
  if (modal) {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    modal.style.display = 'none';
  }
}

function copyXmlToClipboard() {
  const xmlText = document.getElementById('xmlModalContent').textContent;
  if (!xmlText) return;

  const btn = document.getElementById('copyXmlBtn');
  const badge = document.getElementById('copyXmlBadge');

  const handleSuccess = () => {
    if (btn) {
      btn.className = "bg-emerald-600 hover:bg-emerald-500 text-white border border-emerald-400 px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shadow-lg shadow-emerald-950/50";
      btn.innerHTML = `<i class="fa-solid fa-check"></i> <span id="copyXmlBtnText">복사 완료!</span>`;
    }

    if (badge) {
      badge.classList.remove('hidden');
    }

    setTimeout(() => {
      if (btn) {
        btn.className = "bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition";
        btn.innerHTML = `<i class="fa-solid fa-copy"></i> <span id="copyXmlBtnText">클립보드 복사</span>`;
      }
      if (badge) {
        badge.classList.add('hidden');
      }
    }, 2500);
  };

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(xmlText).then(handleSuccess).catch(() => {
      fallbackCopyTextToClipboard(xmlText, handleSuccess);
    });
  } else {
    fallbackCopyTextToClipboard(xmlText, handleSuccess);
  }
}

function fallbackCopyTextToClipboard(text, successCallback) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  textArea.style.top = "0";
  textArea.style.left = "0";
  textArea.style.position = "fixed";
  textArea.style.opacity = "0";
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();

  try {
    const successful = document.execCommand('copy');
    if (successful && successCallback) {
      successCallback();
    } else {
      showToast('클립보드 복사에 실패했습니다.', 'error');
    }
  } catch (err) {
    showToast('클립보드 복사 실패: ' + err, 'error');
  }
  document.body.removeChild(textArea);
}

// ----------------------------------------------------
// Preset Management (Google Apps Script Cloud Storage)
// ----------------------------------------------------
function getOrderedPresetKeys() {
  const currentKeys = Object.keys(presetsState);
  if (currentKeys.length === 0) return [];
  const ordered = presetCustomOrder.filter(k => currentKeys.includes(k));
  currentKeys.forEach(k => {
    if (!ordered.includes(k)) ordered.push(k);
  });
  return ordered;
}

function renderPresetList(filter = '') {
  const listEl = document.getElementById('presetList');
  if (!listEl) return;
  listEl.innerHTML = '';

  const keys = Object.keys(presetsState).filter(k => {
    const p = presetsState[k];
    const matchName = k.toLowerCase().includes(filter.toLowerCase());
    const matchDesc = p.presetDescription && p.presetDescription.toLowerCase().includes(filter.toLowerCase());
    return matchName || matchDesc;
  });

  keys.sort((a, b) => {
    let indexA = presetCustomOrder.indexOf(a);
    let indexB = presetCustomOrder.indexOf(b);
    if (indexA === -1) indexA = 9999;
    if (indexB === -1) indexB = 9999;
    return indexA - indexB;
  });

  if (keys.length === 0) {
    listEl.innerHTML = `<li class="text-xs text-slate-500 text-center py-6"><i class="fa-solid fa-folder-open block text-xl mb-1 text-slate-600"></i>저장된 프리셋이 없습니다.</li>`;
    return;
  }

  keys.forEach(name => {
    const isActive = name === activePresetName;
    const item = document.createElement('li');
    item.setAttribute('draggable', 'true');
    item.setAttribute('data-name', name);
    item.className = `preset-item glass-card-hover p-3 rounded-xl border border-slate-800 cursor-pointer flex items-center justify-between group ${isActive ? 'active' : ''}`;
    
    const descText = presetsState[name].presetDescription ? escapeHtml(presetsState[name].presetDescription) : '';

    item.innerHTML = `
      <div class="flex items-center flex-1 pr-2 truncate">
        <i class="fa-solid fa-grip-vertical text-slate-600 group-hover:text-sky-400 drag-handle mr-2 text-xs" title="끌어서 순서 조정"></i>
        <div class="flex-1 truncate">
          <div class="font-medium text-xs text-slate-200 group-hover:text-sky-300 truncate flex items-center gap-1.5 preset-title-text">
            ${escapeHtml(name)}
          </div>
          ${descText ? `<div class="text-[11px] text-sky-400/80 truncate mt-0.5 font-normal"><i class="fa-regular fa-comment-dots mr-1 text-[10px]"></i>${descText}</div>` : ''}
          <div class="text-[10px] text-slate-500 truncate mt-0.5">
            vGPU: ${presetsState[name].vGpu || 'Default'} | Net: ${presetsState[name].networking || 'Default'}
          </div>
        </div>
      </div>
      <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
        <button onclick="event.stopPropagation(); duplicatePresetByName('${escapeJsString(name)}')" class="duplicate-preset-btn text-slate-500 hover:text-sky-300 p-1 transition" title="다른 이름으로 복제">
          <i class="fa-solid fa-clone text-xs"></i>
        </button>
        <button onclick="event.stopPropagation(); deletePresetByName('${escapeJsString(name)}')" class="delete-preset-btn text-slate-600 hover:text-rose-400 p-1 transition" title="삭제">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>
    `;

    // Click anywhere on preset card to select
    item.addEventListener('click', (e) => {
      if (e.target.closest('.delete-preset-btn') || e.target.closest('.duplicate-preset-btn') || e.target.closest('.drag-handle')) {
        return;
      }
      loadPreset(name);
    });

    // Drag & Drop Events
    item.addEventListener('dragstart', (e) => {
      draggedItemName = name;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', name);
      item.classList.add('dragging');
    });

    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      item.classList.add('drag-over');
    });

    item.addEventListener('dragleave', () => {
      item.classList.remove('drag-over');
    });

    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      document.querySelectorAll('.preset-item').forEach(el => el.classList.remove('drag-over', 'dragging'));
    });

    item.addEventListener('drop', (e) => {
      e.preventDefault();
      item.classList.remove('drag-over');
      const targetName = item.getAttribute('data-name');
      if (draggedItemName && targetName && draggedItemName !== targetName) {
        reorderPresetOrder(draggedItemName, targetName);
      }
    });

    listEl.appendChild(item);
  });
}

function reorderPresetOrder(draggedName, targetName) {
  let currentKeys = Object.keys(presetsState);
  let order = presetCustomOrder.filter(k => currentKeys.includes(k));
  currentKeys.forEach(k => {
    if (!order.includes(k)) order.push(k);
  });

  const fromIndex = order.indexOf(draggedName);
  const toIndex = order.indexOf(targetName);

  if (fromIndex !== -1 && toIndex !== -1) {
    order.splice(fromIndex, 1);
    order.splice(toIndex, 0, draggedName);
    presetCustomOrder = order;
    renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');
    showToast(`'${draggedName}' 프리셋 순서가 조정되었습니다.`, 'info');

    // Save order directly to GAS cloud
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.savePresetOrderToCloud(presetCustomOrder);
    }
  }
}

function loadPreset(name) {
  if (presetsState[name]) {
    activePresetName = name;
    fillFormWithData(presetsState[name]);
    renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');
    showToast(`'${name}' 프리셋을 불러왔습니다.`, 'info');
  }
}

function getUniquePresetName(baseName) {
  if (!baseName || baseName.trim() === '') baseName = '새 프리셋';
  baseName = baseName.trim();
  
  if (!presetsState[baseName]) {
    return baseName;
  }
  
  let cleanBase = baseName.replace(/\s*\(\d+\)$/, '');
  let counter = 2;
  let candidate = `${cleanBase} (${counter})`;
  while (presetsState[candidate]) {
    counter++;
    candidate = `${cleanBase} (${counter})`;
  }
  return candidate;
}

function createNewPreset() {
  activePresetName = '';
  const newName = getUniquePresetName('새 프리셋');
  fillFormWithData({
    presetName: newName,
    presetDescription: "",
    vGpu: "Default",
    networking: "Default",
    memoryInMB: "",
    clipboard: "Default",
    audioInput: "Default",
    videoInput: "Default",
    protectedClient: "Default",
    printerRedirection: "Default",
    mappedFolders: [],
    logonCommand: ""
  });
  renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');
}

function saveCurrentPreset() {
  const data = collectFormData();
  if (!data.presetName) {
    showToast('프리셋 이름을 입력해주세요.', 'error');
    return;
  }

  // If activePresetName changed (renamed), delete old key from cloud
  if (activePresetName && activePresetName !== data.presetName && presetsState[activePresetName]) {
    delete presetsState[activePresetName];
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.deletePresetFromCloud(activePresetName);
    }
  }

  // Auto-generate unique name if saving a new or renamed preset that collides with another existing preset
  if (activePresetName !== data.presetName && presetsState[data.presetName]) {
    data.presetName = getUniquePresetName(data.presetName);
    const nameInput = document.getElementById('presetName');
    if (nameInput) nameInput.value = data.presetName;
    showToast(`중복된 이름이 존재하여 '${data.presetName}'(으)로 새로 저장되었습니다.`, 'info');
  }

  presetsState[data.presetName] = data;
  activePresetName = data.presetName;
  renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');

  // Save directly to GAS Cloud Storage
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success) {
          showToast(`'${data.presetName}' 클라우드 저장 완료!`, 'success');
        } else {
          showToast(`클라우드 저장 실패: ${res ? res.error : '알 수 없는 오류'}`, 'error');
        }
      })
      .withFailureHandler((err) => {
        showToast('클라우드 저장 실패: ' + err.message, 'error');
      })
      .savePresetToCloud(data.presetName, data);
  } else {
    showToast(`'${data.presetName}' 프리셋이 저장되었습니다. (로컬 모드)`, 'success');
  }
}

function duplicateCurrentPreset() {
  const data = collectFormData();
  if (!data.presetName) {
    showToast('프리셋 이름을 입력해주세요.', 'error');
    return;
  }

  const currentName = data.presetName.trim();
  const newName = getUniquePresetName(currentName);
  
  data.presetName = newName;
  data.updatedAt = new Date().toISOString();

  activePresetName = newName;
  presetsState[newName] = data;

  const nameInput = document.getElementById('presetName');
  if (nameInput) nameInput.value = newName;

  renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler((res) => {
        showToast(`'${newName}'(으)로 다른 이름으로 저장되었습니다!`, 'success');
      })
      .savePresetToCloud(newName, data);
  } else {
    showToast(`'${newName}'(으)로 다른 이름으로 저장되었습니다.`, 'success');
  }
}

function duplicatePresetByName(targetName) {
  if (!presetsState[targetName]) return;
  const original = presetsState[targetName];
  const newName = getUniquePresetName(targetName);

  const copiedData = JSON.parse(JSON.stringify(original));
  copiedData.presetName = newName;
  copiedData.updatedAt = new Date().toISOString();

  presetsState[newName] = copiedData;

  loadPreset(newName);
  showToast(`'${targetName}' 프리셋이 '${newName}'(으)로 복제되었습니다.`, 'success');

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run.savePresetToCloud(newName, copiedData);
  }
}

function deleteCurrentPreset() {
  const inputName = document.getElementById('presetName').value.trim();
  const targetName = (activePresetName && presetsState[activePresetName]) ? activePresetName : (presetsState[inputName] ? inputName : null);

  if (targetName) {
    deletePresetByName(targetName);
  } else {
    activePresetName = '';
    createNewPreset();
    showToast('작성 중인 폼 내용이 초기화되었습니다.', 'info');
  }
}

function deletePresetByName(name) {
  if (!name) return;
  if (confirm(`'${name}' 프리셋을 삭제하시겠습니까?`)) {
    if (presetsState[name]) {
      delete presetsState[name];

      // Remove from custom order
      presetCustomOrder = presetCustomOrder.filter(k => k !== name);

      // Cloud Deletion Trigger
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        if (Object.keys(presetsState).length === 0) {
          google.script.run.clearAllPresetsFromCloud();
        } else {
          google.script.run.deletePresetFromCloud(name);
        }
      }

      const remainingKeys = Object.keys(presetsState);
      if (remainingKeys.length > 0) {
        if (activePresetName === name) {
          loadPreset(remainingKeys[0]);
        } else {
          renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');
        }
      } else {
        activePresetName = '';
        createNewPreset();
      }
      showToast(`'${name}' 프리셋이 삭제되었습니다.`, 'info');
    } else {
      activePresetName = '';
      createNewPreset();
    }
  }
}

function filterPresets() {
  const filter = document.getElementById('presetSearch').value;
  renderPresetList(filter);
}

function exportPresetsJson() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(presetsState, null, 2));
  const link = document.createElement('a');
  link.setAttribute("href", dataStr);
  link.setAttribute("download", `wsb_presets_export_${new Date().toISOString().slice(0,10)}.json`);
  document.body.appendChild(link);
  link.click();
  link.remove();
  showToast('프리셋 JSON 파일 내보내기가 완료되었습니다.', 'success');
}

function importPresetsJson(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (typeof imported === 'object' && imported !== null) {
        presetsState = Object.assign({}, presetsState, imported);
        const importedKeys = Object.keys(imported);
        importedKeys.forEach(k => {
          if (!presetCustomOrder.includes(k)) presetCustomOrder.push(k);
        });

        renderPresetList();
        showToast('프리셋 JSON 파일을 성공적으로 불러와 클라우드에 저장합니다.', 'success');

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.saveAllPresetsToCloud(presetsState, presetCustomOrder);
        }
      }
    } catch (err) {
      showToast('올바르지 않은 JSON 파일 포맷입니다.', 'error');
    }
  };
  reader.readAsText(file);
}

function initWsbDropZone() {
  // Prevent browser window navigation ONLY when dragging OS files
  window.addEventListener('dragover', (e) => {
    if (e.dataTransfer && e.dataTransfer.types && Array.from(e.dataTransfer.types).includes('Files')) {
      e.preventDefault();
    }
  }, false);

  window.addEventListener('drop', (e) => {
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      processWsbFile(file);
    }
  }, false);

  const dropZone = document.getElementById('wsbDropZone');
  if (dropZone) {
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-emerald-500', 'bg-emerald-950/30');
    });

    dropZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-emerald-500', 'bg-emerald-950/30');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('border-emerald-500', 'bg-emerald-950/30');
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        processWsbFile(e.dataTransfer.files[0]);
      }
    });
  }
}

function handleWsbFileSelect(event) {
  if (event.target.files && event.target.files.length > 0) {
    processWsbFile(event.target.files[0]);
  }
}

function processWsbFile(file) {
  if (!file) return;

  const fileName = file.name;
  const ext = fileName.substring(fileName.lastIndexOf('.')).toLowerCase();
  if (ext !== '.wsb' && ext !== '.xml') {
    showToast('.wsb 또는 .xml 파일만 업로드할 수 있습니다.', 'warning');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    const content = e.target.result;
    
    // Open import modal automatically on file load
    openXmlImportModal();

    document.getElementById('xmlImportTextarea').value = content;
    
    // Set preset name input based on filename without extension
    const baseName = fileName.replace(/\.(wsb|xml)$/i, '');
    const presetNameInput = document.getElementById('importPresetNameInput');
    if (presetNameInput) {
      presetNameInput.value = baseName;
    }

    const statusEl = document.getElementById('wsbFileStatus');
    if (statusEl) {
      statusEl.innerHTML = `<span class="text-emerald-400 font-semibold"><i class="fa-solid fa-circle-check"></i> ${escapeHtml(fileName)}</span> 파일 로드 완료!`;
    }
    showToast(`'${fileName}' 파일 내용이 로드되었습니다. '설정값 분석 및 프리셋 생성'을 클릭하세요.`, 'info');
  };
  reader.readAsText(file);
}

function openXmlImportModal() {
  document.getElementById('xmlImportTextarea').value = '';
  document.getElementById('importPresetNameInput').value = '';
  const statusEl = document.getElementById('wsbFileStatus');
  if (statusEl) {
    statusEl.textContent = '.wsb 또는 .xml 파일 지원';
  }
  const modal = document.getElementById('xmlImportModal');
  if (modal) {
    modal.style.setProperty('display', 'flex', 'important');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }
}

function closeXmlImportModal() {
  const modal = document.getElementById('xmlImportModal');
  if (modal) {
    modal.style.setProperty('display', 'none', 'important');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }
}

function importXmlFromTextarea() {
  const rawText = document.getElementById('xmlImportTextarea').value;
  if (!rawText || rawText.trim() === '') {
    showToast('분석할 XML 코드를 입력하거나 .wsb 파일을 업로드해주세요.', 'warning');
    return;
  }

  try {
    let vGpu = 'Default';
    let networking = 'Default';
    let memoryInMB = '0';
    let clipboard = 'Default';
    let audioInput = 'Default';
    let videoInput = 'Default';
    let protectedClient = 'Default';
    let printerRedirection = 'Default';
    let logonCmd = '';
    const mappedFolders = [];

    // Engine 1: Attempt strict DOMParser
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(rawText, 'text/xml');
    const parserError = xmlDoc.getElementsByTagName('parsererror');
    
    if (parserError.length === 0 && xmlDoc.getElementsByTagName('Configuration').length > 0) {
      const configNode = xmlDoc.getElementsByTagName('Configuration')[0];
      const getTagValue = (tagName, defaultVal = '') => {
        const el = configNode.getElementsByTagName(tagName)[0];
        return el ? el.textContent.trim() : defaultVal;
      };

      vGpu = getTagValue('VGpu', 'Default');
      networking = getTagValue('Networking', 'Default');
      memoryInMB = getTagValue('MemoryInMB', '0');
      clipboard = getTagValue('ClipboardRedirection', getTagValue('Clipboard', 'Default'));
      audioInput = getTagValue('AudioInput', 'Default');
      videoInput = getTagValue('VideoInput', 'Default');
      protectedClient = getTagValue('ProtectedClient', 'Default');
      printerRedirection = getTagValue('PrinterRedirection', 'Default');

      const mappedFoldersNode = configNode.getElementsByTagName('MappedFolders')[0];
      if (mappedFoldersNode) {
        const folderNodes = mappedFoldersNode.getElementsByTagName('MappedFolder');
        for (let i = 0; i < folderNodes.length; i++) {
          const node = folderNodes[i];
          const hf = node.getElementsByTagName('HostFolder')[0] ? node.getElementsByTagName('HostFolder')[0].textContent.trim() : '';
          const sf = node.getElementsByTagName('SandboxFolder')[0] ? node.getElementsByTagName('SandboxFolder')[0].textContent.trim() : '';
          const roText = node.getElementsByTagName('ReadOnly')[0] ? node.getElementsByTagName('ReadOnly')[0].textContent.trim().toLowerCase() : 'false';
          if (hf) {
            mappedFolders.push({ hostFolder: hf, sandboxFolder: sf, readOnly: roText === 'true' });
          }
        }
      }

      const logonNode = configNode.getElementsByTagName('LogonCommand')[0];
      if (logonNode) {
        const cmdNode = logonNode.getElementsByTagName('Command')[0];
        if (cmdNode) logonCmd = cmdNode.textContent.trim().replace(/&amp;/g, '&');
      }
    } else {
      // Engine 2: Regex Extractor (Guaranteed to parse even with unescaped XML / & symbols)
      const extractTag = (tag) => {
        const reg = new RegExp(`<${tag}>([^<]*)</${tag}>`, 'i');
        const m = rawText.match(reg);
        return m ? m[1].trim() : null;
      };

      vGpu = extractTag('VGpu') || 'Default';
      networking = extractTag('Networking') || 'Default';
      memoryInMB = extractTag('MemoryInMB') || '0';
      clipboard = extractTag('ClipboardRedirection') || extractTag('Clipboard') || 'Default';
      audioInput = extractTag('AudioInput') || 'Default';
      videoInput = extractTag('VideoInput') || 'Default';
      protectedClient = extractTag('ProtectedClient') || 'Default';
      printerRedirection = extractTag('PrinterRedirection') || 'Default';

      const cmdMatch = rawText.match(/<Command>([\s\S]*?)<\/Command>/i);
      if (cmdMatch) {
        logonCmd = cmdMatch[1].trim().replace(/&amp;/g, '&');
      }

      const folderBlockMatch = rawText.match(/<MappedFolders>([\s\S]*?)<\/MappedFolders>/i);
      if (folderBlockMatch) {
        const folderBlocks = folderBlockMatch[1].match(/<MappedFolder>([\s\S]*?)<\/MappedFolder>/gi) || [];
        folderBlocks.forEach(block => {
          const hfMatch = block.match(/<HostFolder>([^<]*)<\/HostFolder>/i);
          const sfMatch = block.match(/<SandboxFolder>([^<]*)<\/SandboxFolder>/i);
          const roMatch = block.match(/<ReadOnly>([^<]*)<\/ReadOnly>/i);
          if (hfMatch && hfMatch[1].trim()) {
            mappedFolders.push({
              hostFolder: hfMatch[1].trim(),
              sandboxFolder: sfMatch ? sfMatch[1].trim() : '',
              readOnly: roMatch ? roMatch[1].trim().toLowerCase() === 'true' : false
            });
          }
        });
      }
    }

    let customName = document.getElementById('importPresetNameInput').value.trim();
    if (!customName) {
      const commentMatch = rawText.match(/Preset Name\s*:\s*([^\r\n]+)/i);
      if (commentMatch && commentMatch[1]) {
        customName = commentMatch[1].trim();
      } else {
        customName = '가져온 프리셋';
      }
    }

    customName = getUniquePresetName(customName);

    let customDesc = '';
    const descMatch = rawText.match(/Description\s*:\s*([^\r\n]+)/i);
    if (descMatch && descMatch[1]) {
      customDesc = descMatch[1].trim();
    } else {
      customDesc = '가져온 XML/.wsb 설정';
    }

    const newPresetObj = {
      presetName: customName,
      presetDescription: customDesc,
      vGpu: vGpu,
      networking: networking,
      memoryInMB: memoryInMB,
      clipboard: clipboard,
      audioInput: audioInput,
      videoInput: videoInput,
      protectedClient: protectedClient,
      printerRedirection: printerRedirection,
      mappedFolders: mappedFolders,
      logonCommand: logonCmd,
      updatedAt: new Date().toISOString()
    };

    presetsState[customName] = newPresetObj;
    if (!presetCustomOrder.includes(customName)) {
      presetCustomOrder.push(customName);
    }
    
    // Close modal BEFORE calling loadPreset or cloud sync
    closeXmlImportModal();

    loadPreset(customName);
    showToast(`✨ '${customName}' 프리셋이 생성되어 클라우드에 저장되었습니다!`, 'success');

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.savePresetToCloud(customName, newPresetObj);
    }

  } catch (err) {
    console.error(err);
    closeXmlImportModal();
    showToast('XML 해석 중 오류가 발생했습니다: ' + err.message, 'error');
  }
}

// ----------------------------------------------------
// Utilities & Helpers
// ----------------------------------------------------
function toPowerShellEncodedCommand(scriptText) {
  if (!scriptText || scriptText.trim() === '') return '';
  const text = scriptText.trim();
  if (/^(powershell|cmd)(\.exe)?/i.test(text) || text.includes('-EncodedCommand')) {
    return text;
  }

  const byteArray = [];
  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);
    byteArray.push(code & 0xff);
    byteArray.push((code >> 8) & 0xff);
  }

  let binary = '';
  for (let i = 0; i < byteArray.length; i++) {
    binary += String.fromCharCode(byteArray[i]);
  }

  const base64 = btoa(binary);
  return `powershell.exe -ExecutionPolicy Bypass -NoProfile -EncodedCommand ${base64}`;
}

function escapeXml(unsafe) {
  if (!unsafe) return '';
  return String(unsafe).replace(/[<>&]/g, function (c) {
    switch (c) {
      case '<': return '&lt;';
      case '>': return '&gt;';
      case '&': return '&amp;';
      default: return c;
    }
  });
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeJsString(str) {
  if (!str) return '';
  return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  
  let bgColor = 'bg-slate-900 border-slate-700 text-slate-200';
  let icon = '<i class="fa-solid fa-circle-info text-sky-400"></i>';

  if (type === 'success') {
    bgColor = 'bg-slate-900 border-emerald-500/50 text-emerald-300';
    icon = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
  } else if (type === 'error') {
    bgColor = 'bg-slate-900 border-rose-500/50 text-rose-300';
    icon = '<i class="fa-solid fa-circle-exclamation text-rose-400"></i>';
  }

  toast.className = `animate-fade-in-down ${bgColor} border px-4 py-3 rounded-xl shadow-2xl text-xs font-medium flex items-center gap-2.5 pointer-events-auto min-w-[240px]`;
  toast.innerHTML = `${icon} <span>${escapeHtml(message)}</span>`;

  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'all 0.3s ease-out';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}
</script>
