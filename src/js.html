let presetCustomOrder = [];

// Initial load on DOM ready

  initDefaults();

function loadPresetOrderFromStorage() {
  try {
    const raw = localStorage.getItem('WSB_PRESET_ORDER');
    if (raw) {
      presetCustomOrder = JSON.parse(raw);
    }
  } catch (e) {
    presetCustomOrder = [];
  }
}

function savePresetOrderToStorage() {
  try {
    localStorage.setItem('WSB_PRESET_ORDER', JSON.stringify(presetCustomOrder));
  } catch (e) {}
}

// ----------------------------------------------------
// Form Data Collector & Setter
// ----------------------------------------------------
function collectFormData() {
  const mappedFolders = [];
  const folderRows = document.querySelectorAll('.folder-row');
  folderRows.forEach(row => {
    const hostFolder = row.querySelector('.host-folder').value.trim();
    const sandboxFolder = row.querySelector('.sandbox-folder').value.trim();
    const readOnly = row.querySelector('.read-only-toggle').checked;
    if (hostFolder) {
      mappedFolders.push({ hostFolder, sandboxFolder, readOnly });
    }
  });

  return {
    presetName: document.getElementById('presetName').value.trim() || 'Custom Sandbox',
    presetDescription: document.getElementById('presetDescription').value.trim(),
    vGpu: document.getElementById('vGpu').value,
    networking: document.getElementById('networking').value,
    memoryInMB: document.getElementById('memoryInMB').value,
    clipboard: document.getElementById('clipboard').value,
    audioInput: document.getElementById('audioInput').value,
    videoInput: document.getElementById('videoInput').value,
    protectedClient: document.getElementById('protectedClient').value,
    printerRedirection: document.getElementById('printerRedirection').value,
    mappedFolders: mappedFolders,
    logonCommand: document.getElementById('logonCommand').value,
    updatedAt: new Date().toISOString()
  };
}

function fillFormWithData(data) {
  document.getElementById('presetName').value = data.presetName || '';
  document.getElementById('presetDescription').value = data.presetDescription || '';
  document.getElementById('vGpu').value = data.vGpu || 'Default';
  document.getElementById('networking').value = data.networking || 'Default';
  document.getElementById('memoryInMB').value = data.memoryInMB || '';
  document.getElementById('clipboard').value = data.clipboard || 'Default';
  document.getElementById('audioInput').value = data.audioInput || 'Default';
  document.getElementById('videoInput').value = data.videoInput || 'Default';
  document.getElementById('protectedClient').value = data.protectedClient || 'Default';
  document.getElementById('printerRedirection').value = data.printerRedirection || 'Default';
  document.getElementById('logonCommand').value = data.logonCommand || '';

  // Render folder rows
  const container = document.getElementById('folderContainer');
  container.innerHTML = '';
  if (data.mappedFolders && data.mappedFolders.length > 0) {
    data.mappedFolders.forEach(folder => addFolderRow(folder));
  } else {
    addFolderRow(); // Add 1 empty row by default
  }
}

function removeFolderRow(rowId) {

// ----------------------------------------------------
// XML Generation & Export
// ----------------------------------------------------
function generateWsbXml(formData) {
  let xml = `<!--\n`;
  xml += `  WSB Manager Web Generated Configuration\n`;
  xml += `  Preset Name : ${escapeXml(formData.presetName || 'Custom Sandbox')}\n`;
  if (formData.presetDescription && formData.presetDescription.trim() !== '') {
    xml += `  Description : ${escapeXml(formData.presetDescription.trim())}\n`;
  }
  xml += `  Generated At: ${new Date().toLocaleString('ko-KR')}\n`;
  xml += `-->\n<Configuration>\n`;

  if (formData.vGpu) xml += `  <VGpu>${formData.vGpu}</VGpu>\n`;
  if (formData.networking) xml += `  <Networking>${formData.networking}</Networking>\n`;

  // Mapped Folders
  if (formData.mappedFolders && formData.mappedFolders.length > 0) {
    xml += `  <MappedFolders>\n`;
    formData.mappedFolders.forEach(folder => {
      if (folder.hostFolder) {
        xml += `    <MappedFolder>\n`;
        xml += `      <HostFolder>${escapeXml(folder.hostFolder)}</HostFolder>\n`;
        if (folder.sandboxFolder) {
          xml += `      <SandboxFolder>${escapeXml(folder.sandboxFolder)}</SandboxFolder>\n`;
        }
        xml += `      <ReadOnly>${folder.readOnly ? 'true' : 'false'}</ReadOnly>\n`;
        xml += `    </MappedFolder>\n`;
      }
    });
    xml += `  </MappedFolders>\n`;
  }

  // Logon Command (Auto-convert PowerShell commands to UTF-16LE Base64 EncodedCommand for 100% Sandbox compatibility)
  if (formData.logonCommand && formData.logonCommand.trim() !== '') {
    const finalCmd = toPowerShellEncodedCommand(formData.logonCommand.trim());
    xml += `  <LogonCommand>\n`;
    xml += `    <Command>${escapeXml(finalCmd)}</Command>\n`;
    xml += `  </LogonCommand>\n`;
  }

  // Memory
  if (formData.memoryInMB && parseInt(formData.memoryInMB) > 0) {
    xml += `  <MemoryInMB>${parseInt(formData.memoryInMB)}</MemoryInMB>\n`;
  }

  // Device Redirections
  if (formData.audioInput) xml += `  <AudioInput>${formData.audioInput}</AudioInput>\n`;
  if (formData.videoInput) xml += `  <VideoInput>${formData.videoInput}</VideoInput>\n`;
  if (formData.protectedClient) xml += `  <ProtectedClient>${formData.protectedClient}</ProtectedClient>\n`;
  if (formData.printerRedirection) xml += `  <PrinterRedirection>${formData.printerRedirection}</PrinterRedirection>\n`;
  if (formData.clipboard) xml += `  <ClipboardRedirection>${formData.clipboard}</ClipboardRedirection>\n`;

  xml += `</Configuration>`;
  return xml;
}

function exportWsbFile() {
  const formData = collectFormData();
  const xmlContent = generateWsbXml(formData);
  const blob = new Blob([xmlContent], { type: 'text/xml;charset=utf-8;' });
  
  const sanitizedFilename = (formData.presetName || 'sandbox_config').replace(/[/\\?%*:|"<>]/g, '_');
  const filename = `${sanitizedFilename}.wsb`;

  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  showToast(`'${filename}' 파일 다운로드가 시작되었습니다.`, 'success');
}

function previewWsbXml() {
  const formData = collectFormData();
  const xmlContent = generateWsbXml(formData);
  document.getElementById('xmlModalContent').textContent = xmlContent;
  const modal = document.getElementById('xmlModal');
  if (modal) {
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    modal.style.display = 'flex';
  }
}

function closeXmlModal() {
  const modal = document.getElementById('xmlModal');
  if (modal) {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    modal.style.display = 'none';
  }
}

function copyXmlToClipboard() {
  const xmlText = document.getElementById('xmlModalContent').textContent;
  navigator.clipboard.writeText(xmlText).then(() => {
    showToast('XML 코드가 클립보드에 복사되었습니다.', 'success');
  }).catch(err => {
    showToast('클립보드 복사 실패: ' + err, 'error');
  });
}

// ----------------------------------------------------
// Preset Management (Local & Cloud Sync)
// ----------------------------------------------------
function loadPresetsFromLocalStorage() {
  try {
    const raw = localStorage.getItem('WSB_PRESETS');
    if (raw !== null) {
      presetsState = JSON.parse(raw);
      // Auto-clean & migrate legacy &amp; or old VS Code URLs in saved presets
      Object.keys(presetsState).forEach(k => {
        if (presetsState[k] && presetsState[k].logonCommand) {
          presetsState[k].logonCommand = presetsState[k].logonCommand
            .replace(/&amp;/g, '&')
            .replace(/https:\/\/code\.visualstudio\.com\/sha\/download\?build=stable&os=win32-x64-user/g, 'https://update.code.visualstudio.com/latest/win32-x64-user/stable')
            .replace(/https:\/\/code\.visualstudio\.com\/sha\/download\?build=stable&amp;os=win32-x64-user/g, 'https://update.code.visualstudio.com/latest/win32-x64-user/stable')
            .replace(/Chrome &amp; VS Code/g, 'Chrome 및 VS Code')
            .replace(/Chrome & VS Code/g, 'Chrome 및 VS Code');
        }
      });
      savePresetsToLocalStorage();
    }
  } catch (e) {
    console.error(e);
  }
  
  const keys = Object.keys(presetsState);
  if (keys.length > 0 && !activePresetName) {
    loadPreset(keys[0]);
  } else if (keys.length === 0) {
    createNewPreset();
  } else {
    renderPresetList();
  }
}

function savePresetsToLocalStorage() {
  localStorage.setItem('WSB_PRESETS', JSON.stringify(presetsState));
}

function renderPresetList(filter = '') {
  const listEl = document.getElementById('presetList');
  if (!listEl) return;
  listEl.innerHTML = '';

  const keys = Object.keys(presetsState).filter(k => {
    const p = presetsState[k];
    const matchName = k.toLowerCase().includes(filter.toLowerCase());
    const matchDesc = p.presetDescription && p.presetDescription.toLowerCase().includes(filter.toLowerCase());
    return matchName || matchDesc;
  });

  keys.sort((a, b) => {
    let indexA = presetCustomOrder.indexOf(a);
    let indexB = presetCustomOrder.indexOf(b);
    if (indexA === -1) indexA = 9999;
    if (indexB === -1) indexB = 9999;
    return indexA - indexB;
  });

  if (keys.length === 0) {
    listEl.innerHTML = `<li class="text-xs text-slate-500 text-center py-6"><i class="fa-solid fa-folder-open block text-xl mb-1 text-slate-600"></i>저장된 프리셋이 없습니다.</li>`;
    return;
  }

  keys.forEach(name => {
    const isActive = name === activePresetName;
    const item = document.createElement('li');
    item.setAttribute('draggable', 'true');
    item.setAttribute('data-name', name);
    item.className = `preset-item glass-card-hover p-3 rounded-xl border border-slate-800 cursor-pointer flex items-center justify-between group ${isActive ? 'active' : ''}`;
    
    const descText = presetsState[name].presetDescription ? escapeHtml(presetsState[name].presetDescription) : '';

    item.innerHTML = `
      <div class="flex items-center flex-1 pr-2 truncate">
        <i class="fa-solid fa-grip-vertical text-slate-600 group-hover:text-sky-400 drag-handle mr-2 text-xs" title="끌어서 순서 조정"></i>
        <div class="flex-1 truncate" onclick="loadPreset('${escapeJsString(name)}')">
          <div class="font-medium text-xs text-slate-200 group-hover:text-sky-300 truncate flex items-center gap-1.5">
            ${escapeHtml(name)}
          </div>
          ${descText ? `<div class="text-[11px] text-sky-400/80 truncate mt-0.5 font-normal"><i class="fa-regular fa-comment-dots mr-1 text-[10px]"></i>${descText}</div>` : ''}
          <div class="text-[10px] text-slate-500 truncate mt-0.5">
            vGPU: ${presetsState[name].vGpu || 'Default'} | Net: ${presetsState[name].networking || 'Default'}
          </div>
        </div>
      </div>
      <button onclick="event.stopPropagation(); deletePresetByName('${escapeJsString(name)}')" class="text-slate-600 hover:text-rose-400 p-1 opacity-0 group-hover:opacity-100 transition" title="삭제">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
    `;

    // Drag & Drop Events
    item.addEventListener('dragstart', (e) => {
      draggedItemName = name;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', name);
      item.classList.add('dragging');
    });

    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      item.classList.add('drag-over');
    });

    item.addEventListener('dragleave', () => {
      item.classList.remove('drag-over');
    });

    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      document.querySelectorAll('.preset-item').forEach(el => el.classList.remove('drag-over', 'dragging'));
    });

    item.addEventListener('drop', (e) => {
      e.preventDefault();
      item.classList.remove('drag-over');
      const targetName = item.getAttribute('data-name');
      if (draggedItemName && targetName && draggedItemName !== targetName) {
        reorderPresetOrder(draggedItemName, targetName);
      }
    });

    listEl.appendChild(item);
  });
}

function reorderPresetOrder(draggedName, targetName) {
  let currentKeys = Object.keys(presetsState);
  let order = presetCustomOrder.filter(k => currentKeys.includes(k));
  currentKeys.forEach(k => {
    if (!order.includes(k)) order.push(k);
  });

  const fromIndex = order.indexOf(draggedName);
  const toIndex = order.indexOf(targetName);

  if (fromIndex !== -1 && toIndex !== -1) {
    order.splice(fromIndex, 1);
    order.splice(toIndex, 0, draggedName);
    presetCustomOrder = order;
    savePresetOrderToStorage();
    renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');
    showToast(`'${draggedName}' 프리셋 순서가 조정되었습니다.`, 'info');
  }
}

function loadPreset(name) {
  if (presetsState[name]) {
    activePresetName = name;
    fillFormWithData(presetsState[name]);
    renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');
    showToast(`'${name}' 프리셋을 불러왔습니다.`, 'info');
  }
}

function createNewPreset() {
  activePresetName = '';
  fillFormWithData({
    presetName: "새 프리셋 " + (Object.keys(presetsState).length + 1),
    presetDescription: "",
    vGpu: "Default",
    networking: "Default",
    memoryInMB: "",
    clipboard: "Default",
    audioInput: "Default",
    videoInput: "Default",
    protectedClient: "Default",
    printerRedirection: "Default",
    mappedFolders: [],
    logonCommand: ""
  });
  renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');
}

function saveCurrentPreset() {
  const data = collectFormData();
  if (!data.presetName) {
    showToast('프리셋 이름을 입력해주세요.', 'error');
    return;
  }

  // If activePresetName changed (renamed), delete old key
  if (activePresetName && activePresetName !== data.presetName && presetsState[activePresetName]) {
    delete presetsState[activePresetName];
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.deletePresetFromCloud(activePresetName);
    }
  }

  presetsState[data.presetName] = data;
  activePresetName = data.presetName;
  savePresetsToLocalStorage();
  renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');

  // Cloud sync if available
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success) {
          showToast(`'${data.presetName}' 클라우드 및 로컬 저장 완료!`, 'success');
        } else {
          showToast(`로컬 저장 완료 (클라우드: ${res ? res.error : ''})`, 'info');
        }
      })
      .savePresetToCloud(data.presetName, data);
  } else {
    showToast(`'${data.presetName}' 프리셋이 로컬에 저장되었습니다.`, 'success');
  }
}

function deleteCurrentPreset() {
  const inputName = document.getElementById('presetName').value.trim();
  const targetName = (activePresetName && presetsState[activePresetName]) ? activePresetName : (presetsState[inputName] ? inputName : null);

  if (targetName) {
    deletePresetByName(targetName);
  } else {
    activePresetName = '';
    createNewPreset();
    showToast('작성 중인 폼 내용이 초기화되었습니다.', 'info');
  }
}

function deletePresetByName(name) {
  if (!name) return;
  if (confirm(`'${name}' 프리셋을 삭제하시겠습니까?`)) {
    if (presetsState[name]) {
      delete presetsState[name];
      savePresetsToLocalStorage();

      // Cloud Deletion Trigger (both method names supported)
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        if (Object.keys(presetsState).length === 0) {
          google.script.run.clearAllPresetsFromCloud();
        } else {
          google.script.run.deletePresetFromCloud(name);
        }
      }

      const remainingKeys = Object.keys(presetsState);
      if (remainingKeys.length > 0) {
        if (activePresetName === name) {
          loadPreset(remainingKeys[0]);
        } else {
          renderPresetList(document.getElementById('presetSearch') ? document.getElementById('presetSearch').value : '');
        }
      } else {
        activePresetName = '';
        createNewPreset();
      }
      showToast(`'${name}' 프리셋이 삭제되었습니다.`, 'info');
    } else {
      activePresetName = '';
      createNewPreset();
    }
  }
}

function filterPresets() {
  const filter = document.getElementById('presetSearch').value;
  renderPresetList(filter);
}

// ----------------------------------------------------
// GAS Cloud Sync & Drive Backup Functions
// ----------------------------------------------------
function syncCloudPresets() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    showToast('구글 클라우드에서 프리셋을 동기화하는 중...', 'info');
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success && res.data) {
          presetsState = res.data;
          savePresetsToLocalStorage();
          
          const keys = Object.keys(presetsState);
          if (keys.length > 0) {
            if (!activePresetName || !presetsState[activePresetName]) {
              loadPreset(keys[0]);
            } else {
              renderPresetList();
            }
          } else {
            createNewPreset();
          }
          showToast('구글 클라우드 프리셋 동기화가 완료되었습니다.', 'success');
        } else {
          showToast('클라우드 동기화 실패: ' + (res ? res.error : '알 수 없는 오류'), 'error');
        }
      })
      .getPresetsFromCloud();
  } else {
    showToast('GAS 환경에서만 클라우드 동기화가 지원됩니다. (로컬 모드 실행 중)', 'info');
  }
}

function syncCloudPresetsSilently() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success && res.data) {
          presetsState = res.data;
          savePresetsToLocalStorage();
          
          const keys = Object.keys(presetsState);
          if (keys.length > 0) {
            if (!activePresetName || !presetsState[activePresetName]) {
              loadPreset(keys[0]);
            } else {
              renderPresetList();
            }
          } else {
            createNewPreset();
          }
        }
      })
      .getPresetsFromCloud();
  }
}

function backupDrive() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    showToast('Google Drive에 백업 생성 중...', 'info');
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success) {
          showToast(res.message, 'success');
        } else {
          showToast(res ? res.error : 'Drive 백업 실패', 'error');
        }
      })
      .exportPresetsToDrive();
  } else {
    showToast('GAS 백엔드가 연결된 환경에서만 Google Drive 백업이 가능합니다.', 'info');
  }
}

// ----------------------------------------------------
// Import / Export JSON Local Files
// ----------------------------------------------------
function exportPresetsJson() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(presetsState, null, 2));
  const link = document.createElement('a');
  link.setAttribute("href", dataStr);
  link.setAttribute("download", `wsb_presets_export_${new Date().toISOString().slice(0,10)}.json`);
  document.body.appendChild(link);
  link.click();
  link.remove();
  showToast('프리셋 JSON 파일 내보내기가 완료되었습니다.', 'success');
}

function importPresetsJson(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (typeof imported === 'object') {
        presetsState = Object.assign({}, presetsState, imported);
        savePresetsToLocalStorage();
        renderPresetList();
        showToast('프리셋 JSON 파일을 성공적으로 불러왔습니다.', 'success');
      }
    } catch (err) {
      showToast('올바르지 않은 JSON 파일 포맷입니다.', 'error');
    }
  };
  reader.readAsText(file);
}

// ----------------------------------------------------
// XML / .wsb File & Textarea Import Feature
// ----------------------------------------------------
function initWsbDropZone() {
  const dropZone = document.getElementById('wsbDropZone');
  if (!dropZone) return;

  dropZone.addEventListener('click', (e) => {
    if (e.target.tagName !== 'INPUT') {
      const input = document.getElementById('wsbFileInput');
      if (input) input.click();
    }
  });

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('border-emerald-500', 'bg-emerald-950/30');
  });

  dropZone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dropZone.classList.remove('border-emerald-500', 'bg-emerald-950/30');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('border-emerald-500', 'bg-emerald-950/30');
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      processWsbFile(e.dataTransfer.files[0]);
    }
  });
}

function handleWsbFileSelect(event) {
  if (event.target.files && event.target.files.length > 0) {
    processWsbFile(event.target.files[0]);
  }
}

function processWsbFile(file) {
  if (!file) return;

  const fileName = file.name;
  const ext = fileName.substring(fileName.lastIndexOf('.')).toLowerCase();
  if (ext !== '.wsb' && ext !== '.xml') {
    showToast('.wsb 또는 .xml 파일만 업로드할 수 있습니다.', 'warning');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    const content = e.target.result;
    document.getElementById('xmlImportTextarea').value = content;
    
    // Set preset name input based on filename without extension
    const baseName = fileName.replace(/\.(wsb|xml)$/i, '');
    const presetNameInput = document.getElementById('importPresetNameInput');
    if (!presetNameInput.value.trim()) {
      presetNameInput.value = baseName;
    }

    const statusEl = document.getElementById('wsbFileStatus');
    if (statusEl) {
      statusEl.innerHTML = `<span class="text-emerald-400 font-semibold"><i class="fa-solid fa-circle-check"></i> ${escapeHtml(fileName)}</span> 파일 로드 완료!`;
    }
    showToast(`'${fileName}' 파일의 내용이 로드되었습니다. '설정값 분석 및 프리셋 생성'을 클릭하세요.`, 'info');
  };
  reader.readAsText(file);
}

function openXmlImportModal() {
  document.getElementById('xmlImportTextarea').value = '';
  document.getElementById('importPresetNameInput').value = '';
  const statusEl = document.getElementById('wsbFileStatus');
  if (statusEl) {
    statusEl.textContent = '.wsb 또는 .xml 파일 지원';
  }
  const modal = document.getElementById('xmlImportModal');
  if (modal) {
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    modal.style.display = 'flex';
  }
}

function closeXmlImportModal() {
  const modal = document.getElementById('xmlImportModal');
  if (modal) {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    modal.style.display = 'none';
  }
}

function importXmlFromTextarea() {
  const rawText = document.getElementById('xmlImportTextarea').value;
  if (!rawText || rawText.trim() === '') {
    showToast('붙여넣을 XML 코드를 입력해주세요.', 'warning');
    return;
  }

  try {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(rawText, 'text/xml');

    const parserError = xmlDoc.getElementsByTagName('parsererror');
    if (parserError.length > 0) {
      showToast('올바르지 않은 XML 형식입니다. 태그 구문을 확인해주세요.', 'error');
      return;
    }

    const configNode = xmlDoc.getElementsByTagName('Configuration')[0];
    if (!configNode) {
      showToast('<Configuration> 태그를 찾을 수 없습니다.', 'error');
      return;
    }

    const getTagValue = (tagName, defaultVal = '') => {
      const el = configNode.getElementsByTagName(tagName)[0];
      return el ? el.textContent.trim() : defaultVal;
    };

    let customName = document.getElementById('importPresetNameInput').value.trim();
    if (!customName) {
      const commentMatch = rawText.match(/Preset Name\s*:\s*([^\r\n]+)/i);
      if (commentMatch && commentMatch[1]) {
        customName = commentMatch[1].trim();
      } else {
        customName = 'XML 가져온 프리셋 (' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ')';
      }
    }

    let customDesc = '';
    const descMatch = rawText.match(/Description\s*:\s*([^\r\n]+)/i);
    if (descMatch && descMatch[1]) {
      customDesc = descMatch[1].trim();
    } else {
      customDesc = '붙여넣은 XML 코드에서 추출된 설정값';
    }

    const mappedFolders = [];
    const mappedFoldersNode = configNode.getElementsByTagName('MappedFolders')[0];
    if (mappedFoldersNode) {
      const folderNodes = mappedFoldersNode.getElementsByTagName('MappedFolder');
      for (let i = 0; i < folderNodes.length; i++) {
        const node = folderNodes[i];
        const hf = node.getElementsByTagName('HostFolder')[0] ? node.getElementsByTagName('HostFolder')[0].textContent.trim() : '';
        const sf = node.getElementsByTagName('SandboxFolder')[0] ? node.getElementsByTagName('SandboxFolder')[0].textContent.trim() : '';
        const roText = node.getElementsByTagName('ReadOnly')[0] ? node.getElementsByTagName('ReadOnly')[0].textContent.trim().toLowerCase() : 'false';
        if (hf) {
          mappedFolders.push({
            hostFolder: hf,
            sandboxFolder: sf,
            readOnly: roText === 'true'
          });
        }
      }
    }

    let logonCmd = '';
    const logonNode = configNode.getElementsByTagName('LogonCommand')[0];
    if (logonNode) {
      const cmdNode = logonNode.getElementsByTagName('Command')[0];
      if (cmdNode) {
        logonCmd = cmdNode.textContent.trim().replace(/&amp;/g, '&');
      }
    }

    const newPresetObj = {
      presetName: customName,
      presetDescription: customDesc,
      vGpu: getTagValue('VGpu', 'Default'),
      networking: getTagValue('Networking', 'Default'),
      memoryInMB: getTagValue('MemoryInMB', '0'),
      clipboard: getTagValue('ClipboardRedirection', getTagValue('Clipboard', 'Default')),
      audioInput: getTagValue('AudioInput', 'Default'),
      videoInput: getTagValue('VideoInput', 'Default'),
      protectedClient: getTagValue('ProtectedClient', 'Default'),
      printerRedirection: getTagValue('PrinterRedirection', 'Default'),
      mappedFolders: mappedFolders,
      logonCommand: logonCmd,
      updatedAt: new Date().toISOString()
    };

    presetsState[customName] = newPresetObj;
    savePresetsToLocalStorage();
    renderPresetList();
    loadPreset(customName);
    closeXmlImportModal();
    showToast(`XML에서 프리셋 '${customName}'이(가) 성공적으로 생성되었습니다!`, 'success');

  } catch (err) {
    console.error(err);
    showToast('XML 해석 중 오류가 발생했습니다: ' + err.message, 'error');
  }
}

// ----------------------------------------------------
// Utilities & Helpers
// ----------------------------------------------------
function toPowerShellEncodedCommand(scriptText) {
  if (!scriptText || scriptText.trim() === '') return '';
  const text = scriptText.trim();
  if (/^(powershell|cmd)(\.exe)?/i.test(text) || text.includes('-EncodedCommand')) {
    return text;
  }

  const byteArray = [];
  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);
    byteArray.push(code & 0xff);
    byteArray.push((code >> 8) & 0xff);
  }

  let binary = '';
  for (let i = 0; i < byteArray.length; i++) {
    binary += String.fromCharCode(byteArray[i]);
  }

  const base64 = btoa(binary);
  return `powershell.exe -ExecutionPolicy Bypass -NoProfile -EncodedCommand ${base64}`;
}

function escapeXml(unsafe) {
  if (!unsafe) return '';
  return String(unsafe).replace(/[<>&]/g, function (c) {
    switch (c) {
      case '<': return '&lt;';
      case '>': return '&gt;';
      case '&': return '&amp;';
      default: return c;
    }
  });
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeJsString(str) {
  if (!str) return '';
  return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  
  let bgColor = 'bg-slate-900 border-slate-700 text-slate-200';
  let icon = '<i class="fa-solid fa-circle-info text-sky-400"></i>';

  if (type === 'success') {
    bgColor = 'bg-slate-900 border-emerald-500/50 text-emerald-300';
    icon = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
  } else if (type === 'error') {
    bgColor = 'bg-slate-900 border-rose-500/50 text-rose-300';
    icon = '<i class="fa-solid fa-circle-exclamation text-rose-400"></i>';
  }

  toast.className = `animate-fade-in-down ${bgColor} border px-4 py-3 rounded-xl shadow-2xl text-xs font-medium flex items-center gap-2.5 pointer-events-auto min-w-[240px]`;
  toast.innerHTML = `${icon} <span>${escapeHtml(message)}</span>`;

  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'all 0.3s ease-out';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}
